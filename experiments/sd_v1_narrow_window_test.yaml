# ============================================================
# Supply & Demand V1 - Narrow Window Test (for warnings)
# ============================================================
# Description: Test config with narrow date range (should trigger warnings)
# Purpose: Validate window utilization warnings when using small subset
# ============================================================

name: "sd_v1_narrow_window_test"
description: "Test narrow window usage to trigger warnings"

# Use synthetic data for testing
symbols:
  - "BTC/USDT"

# Narrow date range (will use only subset of generated candles)
# This should trigger low utilization warning in synthetic mode
start_date: "2024-01-01"
end_date: "2024-01-02"  # Just 2 days

timeframes:
  htf: "4h"
  itf: "1h"
  ltf: "15m"
  rtf: null

candle_classification:
  boring_body_ratio: 0.50
  exciting_body_ratio: 0.50

zone_detection:
  min_base_candles: 1
  max_base_candles: 6
  min_legout_candles: 1
  proximal_mode: "body"

scoring:
  min_setup_score: 6.0
  freshness_touches_best: 0
  freshness_touches_good: 1
  base_time_best: 3
  base_time_good: 6
  legout_strength_high_threshold: 0.10
  legout_strength_mid_threshold: 0.05

trade_management:
  risk_pct: 0.02
  breakeven_at_r: 2.0
  take_profit_at_r: 3.0
  min_reward_risk: 3.0
  stop_buffer_pct: 0.001

trend_detection:
  pivot_len: 5
  pivots_to_consider: 4

mtf_gating:
  allow_eq_trades: true
  eq_requires_trend_alignment: true
  eq_min_setup_score_bonus: 1.0

entry:
  entry_mode: "limit"
  ttl_bars: 10

costs:
  fees_bps: 10.0
  slippage_bps: 5.0

initial_capital: 10000.0

# Generate synthetic data (10 days worth, but only use 2 days)
data_generation:
  num_candles: 1000  # ~10 days
  volatility: 0.02
  seed: 42
