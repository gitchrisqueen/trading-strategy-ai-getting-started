# Supply & Demand V1 - Fill Logic Test Configuration
# Minimal config for testing limit order fills

name: "sd_v1_fill_test"
description: "Minimal test for limit order fill logic"

# Data source
data_source: "synthetic"

# Single symbol for quick testing
symbols:
  - "BTC/USDT"

# Capital
initial_capital: 10000

# Multi-timeframe configuration
timeframes:
  htf: "4h"
  itf: "1h"
  ltf: "15m"
  rtf: null

# Synthetic data generation
data_generation:
  seed: 42
  num_candles: 500  # Reduced for quick test
  volatility: 0.02

# Candle classification
candle_classification:
  boring_body_ratio: 0.50
  exciting_body_ratio: 0.50

# Zone detection
zone_detection:
  min_base_candles: 1
  max_base_candles: 6
  min_legout_candles: 1
  proximal_mode: "body"

# Scoring (relaxed for more trades)
scoring:
  min_setup_score: 4.0  # Lower threshold
  freshness_touches_best: 0
  freshness_touches_good: 1
  base_time_best: 3
  base_time_good: 6
  legout_strength_high_threshold: 0.10
  legout_strength_mid_threshold: 0.05

# Trade management
trade_management:
  risk_pct: 0.02
  breakeven_at_r: 2.0
  take_profit_at_r: 3.0
  min_reward_risk: 3.0
  stop_buffer_pct: 0.001

# Trend detection
trend_detection:
  pivot_len: 5
  pivots_to_consider: 4

# MTF gating
mtf_gating:
  allow_eq_trades: true
  eq_requires_trend_alignment: false  # More permissive
  eq_min_setup_score_bonus: 0.0

# Entry configuration
entry:
  entry_mode: "limit"
  ttl_bars: 10

# Costs
costs:
  fees_bps: 10.0
  slippage_bps: 5.0

# RTF refinement (disabled)
rtf_refinement:
  enabled: false

# Zone attempts
zone_attempts:
  max_attempts: 1
  cooldown_bars: null

# Parallel execution (disabled for testing)
parallel:
  enabled: false
